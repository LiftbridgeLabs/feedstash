# Standard security scans (Jason's Rule #2). The scans themselves live in
# LiftbridgeLabs/.github, .github/workflows/security-scan.yml. docker-publish.yml
# also runs them first, so a failing scan stops an image release.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, so new advisories against unchanged dependencies are seen.
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # Pinned to a commit, like the actions in docker-publish.yml (Dependabot keeps it current).
    uses: LiftbridgeLabs/.github/.github/workflows/security-scan.yml@cdcf28b279bc286d49328eb8e32caf5d2f4c1409 # one-scan-job trial
    with:
      npm-dirs: "clients/email-worker"
      pip-requirements: "requirements.txt"
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.ALERTS_DISCORD_WEBHOOK }}
