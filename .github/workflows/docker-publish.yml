# Tests, builds and smoke-tests the image, then pushes it to Docker Hub for amd64 and arm64.
# Runs when a version tag like v1.2.0 is pushed, or by hand from the Actions tab.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with write access).
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Actions are pinned to exact commits (Dependabot keeps them current): this job holds the Docker Hub token, and a
# moved tag must not be able to publish a different image.
permissions:
  contents: read

env:
  IMAGE: liftbridgelabs/feedstash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The browser tests too: they're what catch a broken ES module or a CSP mistake in the web app.
      - run: pytest -q
        env:
          READER_E2E_BROWSER: /usr/bin/google-chrome

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: feedstash:smoke
          build-args: VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke test (starts, drops root, serves the setup page)
        run: |
          mkdir -p data && sudo chown 0:0 data
          docker run -d --name smoke -p 8672:8672 -e PUID=1234 -e PGID=1234 -v "$PWD/data:/data" feedstash:smoke
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8672/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8672/ | grep -q 'data-login="setup"'
          test "$(docker exec smoke sh -c 'stat -c %u /proc/1')" = "1234"
          test "$(stat -c %u data/feedstash.db)" = "1234"

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
