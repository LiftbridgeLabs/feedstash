# Tests, builds and smoke-tests the image, then pushes it to Docker Hub for amd64 and arm64.
# Runs when a version tag like v1.2.0 is pushed, or by hand from the Actions tab.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with write access).
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: liftbridgelabs/feedstash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: feedstash:smoke
          build-args: VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke test (starts, drops root, serves the setup page)
        run: |
          mkdir -p data && sudo chown 0:0 data
          docker run -d --name smoke -p 8672:8672 -e PUID=1234 -e PGID=1234 -v "$PWD/data:/data" feedstash:smoke
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8672/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8672/ | grep -q 'data-login="setup"'
          test "$(docker exec smoke sh -c 'stat -c %u /proc/1')" = "1234"
          test "$(stat -c %u data/feedstash.db)" = "1234"

      - name: Container logs
        if: always()
        run: docker logs smoke || true

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
