<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>FeedStash Settings</title>
<link rel="stylesheet" href="popup.css" />
<script src="theme.js"></script>
</head>
<body class="options-body">
  <h1>FeedStash Settings</h1>

  <label class="field">
    <span>Server URL</span>
    <input type="text" id="baseUrlInput" placeholder="https://stash.yourdomain.com" />
  </label>

  <label class="field">
    <span>API token</span>
    <input type="password" id="tokenInput" autocomplete="off" placeholder="Paste a token made for this browser" />
  </label>

  <label class="field">
    <span>Appearance</span>
    <select id="appearanceSelect">
      <option value="auto">Match the browser</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>

  <button id="saveBtn" class="primary-btn">Save</button>
  <button id="testBtn" class="primary-btn secondary">Test connection</button>
  <p id="status"></p>

<script src="common.js"></script>
<script src="options.js"></script>
</body>
</html>
