name = "feedstash-email-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Your FeedStash server's address, as reachable from the internet (no trailing slash).
FEEDSTASH_API_BASE = "https://feedstash.invalid"  # replace: .invalid never resolves, so a missed edit fails safely

# Who may send to this address, comma separated: whole addresses (you@example.com), whole domains
# (@example.com or example.com), or * for anyone. Leave it empty and anyone who learns the address can post into
# your stash, so set it. It matches who sent the mail, so auto-forwarded newsletters arrive as the newsletter's
# address, not yours. It's a spam filter, not a lock: a determined sender can fake the sender address.
ALLOWED_SENDERS = "you@example.com"

# The lock (recommended): a random code that must follow a "+" in the address mail is sent to, like
# stash+k7q2x9m4@yourdomain.com. Turn on Email Routing -> Settings -> Subaddressing in Cloudflare too.
# ADDRESS_SECRET = "k7q2x9m4"

# FEEDSTASH_API_TOKEN is a secret, NOT set here.
# After deploying the worker, run:
#   npx wrangler secret put FEEDSTASH_API_TOKEN
# and paste in a token made for this client under Settings -> Connected apps.
